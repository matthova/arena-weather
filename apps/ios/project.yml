# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). `xcodegen generate` writes WeatherAlerts.xcodeproj,
# which is git-ignored: this file is the project. See README.md in this folder.
name: WeatherAlerts
options:
  bundleIdPrefix: com.arenaweather
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.3"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  WeatherAlertsKit:
    path: Packages/WeatherAlertsKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # The iOS app. Slice 3 adds a `WeatherAlertsMac` target (platform: macOS) that compiles Sources/Shared
  # plus its own Sources/macOS entry point against the same WeatherAlertsKit package.
  WeatherAlerts:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    dependencies:
      - package: WeatherAlertsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WEATHER_ALERTS_BUNDLE_ID)
        PRODUCT_NAME: WeatherAlerts
        INFOPLIST_FILE: Sources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/iOS/WeatherAlerts.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(WEATHER_ALERTS_TEAM)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - package: WeatherAlertsKit/WeatherAlertsKitTests
      gatherCoverageData: false
