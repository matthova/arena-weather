name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, typecheck, test (core, api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  android:
    name: Android app (assembleDebug + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      # google-services.json is not committed: the build applies the Firebase plugin only when it exists.
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon

  ios:
    name: iOS app (Swift package tests + xcodebuild)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodebuild -version && swift --version
      - run: swift test
        working-directory: apps/ios/Packages/WeatherAlertsKit
      - run: xcodegen generate
      # No signing on CI: the entitlements/team are per developer (Config/Local.xcconfig).
      # The full log is uploaded as an artifact; errors are surfaced as annotations and in the step output.
      - name: xcodebuild (iOS Simulator)
        run: |
          status=0
          xcodebuild build -project WeatherAlerts.xcodeproj -scheme WeatherAlerts -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            > xcodebuild.log 2>&1 || status=$?
          echo "xcodebuild exited with $status"
          echo "--- errors ---"
          grep -E '(^|: )error:' xcodebuild.log | sort -u | head -n 80 || true
          echo "--- deprecations / warnings ---"
          grep -E 'warning:' xcodebuild.log | sort -u | head -n 40 || true
          echo "--- result ---"
          grep -E '^\*\* |BUILD (SUCCEEDED|FAILED)' xcodebuild.log || true
          # GitHub annotations: "path:line:col: error: message" → ::error file=path,line=line,col=col::message
          grep -E '^/.+:[0-9]+:[0-9]+: error: ' xcodebuild.log | sort -u | head -n 50 \
            | sed -E 's|^(/[^:]+):([0-9]+):([0-9]+): error: (.*)$|::error file=\1,line=\2,col=\3::\4|' || true
          grep -E '^(error: |xcodebuild: error: )' xcodebuild.log | sort -u | head -n 20 \
            | sed -E 's|^(xcodebuild: )?error: (.*)$|::error ::\2|' || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcodebuild-log
          path: apps/ios/xcodebuild.log
          if-no-files-found: ignore
